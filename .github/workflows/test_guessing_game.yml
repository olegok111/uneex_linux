on:
  push:
    branches: ["main"]
    paths:
      - 12_InstallPackaging_1/**
      - .github/actions/**

jobs:
  task12_1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install packages
        run: sudo apt install autoconf autoconf-archive automake intltool help2man python-roman doxygen libtool check -y

      - name: autoreconf
        working-directory: 12_InstallPackaging_1
        run: autoreconf -fis

      - name: configure
        working-directory: 12_InstallPackaging_1
        run: ./configure

      - name: make
        working-directory: 12_InstallPackaging_1
        run: make

      - name: Run game
        working-directory: 12_InstallPackaging_1
        run: echo -e 'n\ny\nn\ny\ny\nn\ny' | src/guess | grep 'The number must be 37'

